name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Without BJ_SLOW the calculator is checked against ten cells of the
      # strategy chart and a short Monte Carlo, which is a minute rather than
      # four. The full 260 cells and the long run are in calculator.yml, on
      # anything that touches the calculator and nightly regardless.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

      # The table art is committed output. Nothing regenerates it on a deal, so
      # an edit to the generator without a rerun leaves the table pointing at
      # art that no longer matches, or at a file that was never written.
      - name: The cards match their generator
        run: |
          python scripts/make_cards.py
          git diff --exit-code --stat .github/cards \
            || { echo "::error::run scripts/make_cards.py and commit .github/cards"; exit 1; }
          test -z "$(git status --porcelain .github/cards)" \
            || { echo "::error::scripts/make_cards.py writes files that are not committed"; exit 1; }

      # The table in README.md is output too, drawn from .github/blackjack.json.
      # A renderer change without a redraw ships a stale table to the profile.
      - name: The table matches the state it is drawn from
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import blackjack; blackjack.write_readme(blackjack.load_state())"
          git diff --exit-code --stat README.md \
            || { echo "::error::the BLACKJACK block is stale, redraw it from .github/blackjack.json"; exit 1; }
