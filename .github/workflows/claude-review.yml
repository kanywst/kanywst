name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. The same is true of a
    # Dependabot pull request: it runs in the Dependabot secrets context, where
    # the repository secret below is empty, and a version bump is not the kind
    # of diff this review exists for. Drafts are skipped until they are marked
    # ready, which is what the ready_for_review trigger is for.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            This is the GitHub profile repository. The readme is prose plus a guest book
            table that .github/workflows/guestbook.yml regenerates from issues via
            scripts/update_guestbook.py.

            There is no CI here beyond the guest book workflow, so this review is the only
            check.

            Look for what only a reader can catch:

            1. Untrusted input reaching the readme. A guest book entry is written by anyone
               who opens an issue, and it is interpolated into HTML in a public page. Escape
               the user name and the message, keep the length bound, and neutralise anything
               that could close a tag or break the table.

            2. The marker contract. The script rewrites only what sits between
               GUESTBOOK:START and GUESTBOOK:END. A change to the markers, or content moved
               across them, means the workflow either clobbers hand-written prose or stops
               updating.

            3. Workflow permissions. The job writes to the default branch on an issue event,
               so its token scope and its trigger conditions decide who can cause a commit.

            4. Image URLs. This readme renders at github.com/kanywst rather than in the
               repository, so a relative image path resolves against the wrong base and
               silently fails to load.

            5. Anything that has to be updated by hand. A count or a list in this file will
               go stale, and a live link is nearly always available instead.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
