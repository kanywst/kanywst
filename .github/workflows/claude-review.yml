name: Claude review

# checks.yml answers "do the tests pass and is the generated output committed".
# This asks the question no script here can. It reviews, it does not gate:
# nothing here is a required check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. The same is true of a
    # Dependabot pull request: it runs in the Dependabot secrets context, where
    # the repository secret below is empty, and a version bump is not the kind
    # of diff this review exists for. Drafts are skipped until they are marked
    # ready, which is what the ready_for_review trigger is for.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            This is the GitHub profile repository. The readme is prose plus two blocks that
            workflows regenerate from issues: a guest book
            (.github/workflows/guestbook.yml, scripts/update_guestbook.py) and a blackjack
            table anyone on the internet can play by clicking a link
            (.github/workflows/blackjack.yml, scripts/blackjack.py, scripts/bjmath.py,
            state in .github/blackjack.json and .github/blackjack-log.txt).

            checks.yml already runs the tests, markdownlint, and the two regeneration
            checks, so do not spend the review on what a script has answered. Read the diff
            for what only a reader can catch, and only against the parts it touches:

            1. Untrusted input reaching the readme or the state. An issue title and the
               login that opened it are written by anyone, and both are interpolated into
               HTML on a public page and stored in a committed JSON file that the next run
               reads back. Escape it, bound its length, and treat everything loaded from the
               state file as hostile — it is only as trustworthy as the run that wrote it.

            2. The marker contracts. Each script rewrites only what sits between its own
               START and END markers. A change to a marker, or content moved across one,
               means a workflow either clobbers hand-written prose or stops updating.

            3. Workflow permissions and triggers. These jobs commit to the default branch on
               an issue event, so the token scope and the trigger conditions decide who can
               cause a commit and what it can touch.

            4. Image URLs. This readme renders at github.com/kanywst rather than in the
               repository, so a relative image path resolves against the wrong base and
               silently fails to load.

            5. The game being right, when the diff touches it. Settlement pays 3:2 on a
               natural and 1:1 otherwise, insurance 2:1; a double or a split changes what is
               at risk after the bet was made. The shoe is stored as the cards that have
               come out of it, the hole card is not drawn until it is turned over, and
               nothing may tell a player the count before the bet. Money that a row cannot
               account for is a bug even when the arithmetic is right.

            6. Anything that has to be updated by hand. A count or a list in a file that a
               workflow also writes will go stale, and a live link or a derived number is
               nearly always available instead.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
