name: Build README

on:
  schedule:
    # Daily. The upstream PR list and the release list both move slowly enough
    # that anything more frequent would just be empty commits.
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/build_readme.py"
      - ".github/workflows/readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # The guest book workflow also commits to README.md. Serialising the two
  # avoids a push race when someone signs it while this job is running.
  group: readme-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fill the generated sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh the generated README sections"
          git push
