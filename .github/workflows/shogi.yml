name: Shogi

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  play:
    if: startsWith(github.event.issue.title, 'shogi|')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    # Shared with guestbook.yml, which also commits to README.md.
    # queue: max because the default, queue: single, cancels whichever run is
    # already waiting — with three moves in flight the middle one would be
    # dropped and its issue left open. Declared on the job, not the workflow,
    # so runs skipped by the `if:` above never take up a slot.
    concurrency:
      group: readme-write
      # queue: max cannot be combined with cancel-in-progress: true, and false
      # is the default, so it is left unset rather than spelled out.
      queue: max

    steps:
      # ref: main because an `issues` event pins GITHUB_SHA to the commit that
      # was head when the issue was opened. A run that waited in the queue would
      # otherwise check out the pre-move tree and its push would be rejected.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Play the move and push
        id: move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The delimiter is random because $GITHUB_OUTPUT is a shared file and
          # a fixed one is guessable. See the note in GitHub's workflow-commands
          # docs on multiline strings.
          delim="MOVE_$(openssl rand -hex 16)"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            # Re-run against the refreshed board rather than replaying a diff:
            # another move may have landed while this one waited.
            message="$(python scripts/shogi.py)"

            git add README.md .github/shogi.json .github/shogi-log.txt
            if git diff --cached --quiet; then
              break
            fi
            git commit --quiet -m "shogi: move by @${ISSUE_USER}"

            if git push --quiet; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "push kept losing the race" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

          {
            echo "message<<${delim}"
            echo "${message}"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Close the issue
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: |
            ${{ steps.move.outputs.message }}

            Board is on [my profile](https://github.com/kanywst#shogi). Thanks @${{ github.event.issue.user.login }}.

      # Without this the player is told nothing at all: the steps above carry an
      # implicit success() gate, so a failed push closes no issue and posts no
      # comment, and only the repo owner ever sees the red run.
      - name: Say so if it failed
        if: failure()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Something went wrong on my side. Check the board before clicking again — the move may or may not have landed.
