name: Shogi

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with .github/workflows/guestbook.yml, which also commits to README.md.
  group: readme-write
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'shogi|')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Play the move
        id: move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "message<<SHOGI_EOF"
            python scripts/shogi.py
            echo "SHOGI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/shogi.json
          git diff --cached --quiet || git commit -m "将棋: @${{ github.event.issue.user.login }}"
          git push

      - name: Close the issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: |
            ${{ steps.move.outputs.message }}

            @${{ github.event.issue.user.login }} ありがとうございます。盤は[プロフィール](https://github.com/kanywst)にあります。
